[package]
name = "baro"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
fuzzy-matcher = "0.3"
walkdir = "2"
open = "5"
dirs = "5"
serde_json = "1"
base64 = "0.22"
unicode-normalization = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSFileManager", "NSURL", "NSError"] }
objc2-core-foundation = { version = "0.3", features = ["CFMachPort", "CFRunLoop", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGRemoteOperation", "CGEventSource", "CGWindowLevel"] }
